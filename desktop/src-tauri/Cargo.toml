[package]
name = "botdock-desktop"
version = "0.0.0"
edition = "2021"
description = "Tauri shell around the BotDock daemon"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# Profile tweaks so the shell binary stays small — the wrapper itself
# does almost nothing, no need to pay for unoptimized release size.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
