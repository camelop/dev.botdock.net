<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BotDock</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; color: #f6f6f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .wrap { display: flex; align-items: center; justify-content: center; height: 100vh; }
    h1 { margin: 0 0 8px; font-weight: 700; letter-spacing: -0.02em; }
    p { margin: 0; opacity: 0.6; font-size: 14px; }
  </style>
</head>
<body>
  <!-- Tauri's bundler requires a frontendDist directory with at least one
       file. The shell never actually loads this page — main.rs creates a
       window pointed at the running daemon's URL — but the bundler walks
       this directory for asset packing. Keep it tiny. -->
  <div class="wrap">
    <div style="text-align:center">
      <h1>BotDock</h1>
      <p>Starting daemon…</p>
    </div>
  </div>
</body>
</html>
